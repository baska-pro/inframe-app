name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run lint

      - name: Build
        env:
          VITE_TARGET_URL: https://script.google.com/macros/s/RELEASE_PLACEHOLDER/exec
          VITE_APP_TITLE: InFrame App
        run: npm run build

      - name: Package build
        run: |
          cd dist
          zip -r ../inframe-app-${GITHUB_REF_NAME}.zip .
          cd ..
          sha256sum inframe-app-${GITHUB_REF_NAME}.zip > inframe-app-${GITHUB_REF_NAME}.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "inframe-app-${GITHUB_REF_NAME}.zip" \
            "inframe-app-${GITHUB_REF_NAME}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            --title "InFrame App ${GITHUB_REF_NAME}"
